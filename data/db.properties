# ============================================================================
# CẤU HÌNH KẾT NỐI POSTGRESQL (QUIZ ĐỐI KHÁNG 1V1)
# ============================================================================

# Bật hoặc tắt kết nối cơ sở dữ liệu (true = kết nối PostgreSQL, false = dùng file local)
db.enabled=true

# Địa chỉ URL kết nối PostgreSQL
# Cú pháp: jdbc:postgresql://<host>:<port>/<database_name>
db.url=jdbc:postgresql://localhost:5432/quiz_db

# Tài khoản và mật khẩu đăng nhập PostgreSQL
db.user=postgres
db.password=123456

# Tự động tạo bảng nếu chưa có (true/false)
db.auto_create_tables=true

# Tự động nạp 240 câu hỏi từ questions.txt và users từ users.dat nếu CSDL đang trống (true/false)
db.auto_seed=true
